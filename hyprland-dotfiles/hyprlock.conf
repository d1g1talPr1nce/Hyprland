# MIDNIGHT / ICE — HYPRLOCK
# Paths are resolved by install.sh or test.sh. Empty monitor = every output.
$ice = rgba(BCEEFFff)
$blue = rgba(72ACFFff)
$muted = rgba(8DAAC4ff)
$font = Hack Nerd Font Mono

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = iceEase, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, iceEase
    animation = fadeOut, 1, 3, iceEase
    animation = inputFieldColors, 1, 3, iceEase
    animation = inputFieldDots, 1, 2, iceEase
}

background {
    monitor =
    path = $HOME/.config/hypr/midnight-lock/wall4.png
    color = rgba(080F1Dff)
    blur_passes = 2
    blur_size = 3
    noise = 0.008
    contrast = 0.95
    brightness = 0.72
    vibrancy = 0.08
}

# A translucent midnight wash retains the wallpaper's blue/red detail.
shape {
    monitor =
    size = 100%, 100%
    color = rgba(07142638)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = M I D N I G H T   /   I C E
    color = rgba(BCEEFFb0)
    font_family = $font
    font_size = 12
    position = 0, -30
    halign = center
    valign = top
    zindex = 3
}

label {
    monitor =
    text = $TIME
    color = rgba(EDF8FFff)
    font_family = $font
    font_size = 70
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(050B18bb)
    zindex = 3
}

label {
    monitor =
    text = cmd[update:60000] date '+%A  ·  %d.%m.%Y'
    color = $muted
    font_family = $font
    font_size = 14
    position = 0, 202
    halign = center
    valign = center
    zindex = 3
}

# Authentication card: dark glass, restrained two-tone edge.
shape {
    monitor =
    size = 408, 430
    color = rgba(080F1Ddc)
    rounding = 30
    border_size = 1
    border_color = rgba(91DCFF88) rgba(345B8844) 135deg
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(020711bb)
    zindex = 1
}

# Thin light strip above portrait.
shape {
    monitor =
    size = 62, 2
    color = rgba(9DE8FFb0)
    rounding = 1
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(72ACFF44)
    zindex = 2
}

image {
    monitor =
    path = $HOME/.config/hypr/midnight-lock/durov.jpg
    size = 92
    rounding = 24
    border_size = 2
    border_color = rgba(BCEEFFee) rgba(5286B8bb) 135deg
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(72ACFF33)
    zindex = 3
}

label {
    monitor =
    text = $USER
    color = $ice
    font_family = $font
    font_size = 21
    position = 0, -18
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 316, 56
    outline_thickness = 2
    outer_color = rgba(72ACFFcc) rgba(BCEEFFcc) 45deg
    inner_color = rgba(12223Aee)
    font_color = rgba(E4F5FFff)
    font_family = $font
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 2
    fade_on_empty = false
    placeholder_text = <span foreground="##8DAAC4">Heslo k odemčení</span>
    hide_input = false
    rounding = 16
    check_color = rgba(79D8F7ff) rgba(BCEEFFff) 45deg
    fail_color = rgba(FF819Bff)
    fail_text = <i>Nesprávné heslo · $ATTEMPTS</i>
    capslock_color = rgba(E9C58Bff)
    position = 0, -84
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(72ACFF22)
    zindex = 4
}

label {
    monitor =
    text = 󰣇  A R C H   L I N U X
    color = $ice
    font_family = $font
    font_size = 15
    position = 0, -156
    halign = center
    valign = center
    zindex = 3
}

